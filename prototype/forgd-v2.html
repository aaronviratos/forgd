let imp=null;
const FIELD_NAMES={weight:'Weight',bodyFat:'Body fat',steps:'Steps',rhr:'Resting HR',hrv:'HRV',recovery:'Recovery',strain:'Strain',sleep:'Sleep',bpSys:'BP systolic',bpDia:'BP diastolic',cal:'Calories',pro:'Protein',carb:'Carbs',fat:'Fat',water:'Water'};
const SUMMED=new Set(['steps','cal','pro','carb','fat','water']);
const IMPORT_MAP=[['recovery',/recovery score/i],['hrv',/heart rate variability|\bhrv\b/i],['rhr',/resting heart rate/i],['strain',/day strain/i],
  ['steps',/step count|^steps?\b/i],['bpSys',/systolic/i],['bpDia',/diastolic/i],['bodyFat',/body fat/i],['weight',/weight|body mass/i,/lean|index/i],
  ['sleep',/asleep duration|sleep analysis.*(asleep|total)|total sleep|^asleep/i],['cal',/dietary energy|energy consumed|calories consumed/i],
  ['pro',/protein/i],['carb',/carbohydrate/i],['fat',/total fat|^fat\b/i],['water',/water/i]];
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function toDs(s,cycle){s=String(s||'').trim();const m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{2}))?/);
  if(m){let ds=`${m[1]}-${m[2]}-${m[3]}`;if(cycle&&m[4]!=null&&Number(m[4])>=15)ds=addDays(ds,1);return ds}
  const t=Date.parse(s);return isNaN(t)?null:ymd(new Date(t))}
function conv(field,unitHint,raw){
  let v=Number(String(raw).replace(/,/g,'').trim());if(raw===''||raw==null||!isFinite(v))return null;
  const u=String(unitHint||'');

  if(field==='sleep'){if(/\(min|minute/i.test(u))v/=60;else if(/\(s\)|second/i.test(u))v/=3600}
  if(field==='water'){if(/\bml\b/i.test(u))v/=29.5735;else if(/\(l\)|\bliter|\blitre/i.test(u))v*=33.814}
  if(field==='cal'&&/\bkj\b/i.test(u))v/=4.184;

}
function addVal(by,ds,f,v){if(v==null||!ds)return;const d=by[ds]||(by[ds]={});d[f]=SUMMED.has(f)&&d[f]!=null&&by.__sum?d[f]+v:v}
function fromCSV(text,name){
  const rows=parseCSV(text);if(rows.length<2)throw new Error('That file has no data rows.');
  const head=rows[0].map(x=>x.trim());
  const di=head.findIndex(x=>/cycle start|^date|start time|date\/time|timestamp/i.test(x));
  if(di<0)throw new Error('Could not find a date column in that file.');
  const cycle=/cycle start/i.test(head[di]);
  const cols=[];head.forEach((x,i)=>{if(i===di)return;const m=IMPORT_MAP.find(([f,re,no])=>re.test(x)&&!(no&&no.test(x)));if(m&&!cols.some(c=>c.f===m[0]))cols.push({i,f:m[0],h:x})});
  if(!cols.length)throw new Error('None of the columns in that file match anything the log tracks.');
  const by={};rows.slice(1).forEach(r=>{const ds=toDs(r[di],cycle);cols.forEach(c=>{const v=conv(c.f,c.h,r[c.i]);if(v!=null&&ds){(by[ds]||(by[ds]={}))[c.f]=v}})});
  return {by,source:cycle||/recovery|strain/i.test(head.join())?'Whoop':/health|auto export/i.test(name)?'Apple Health':'CSV file',mapped:cols.map(c=>[c.h,c.f])};
}
function fromJSON(text){
  const o=JSON.parse(text);const metrics=o&&o.data&&o.data.metrics;
  if(!Array.isArray(metrics))throw new Error('This JSON is not a Health Auto Export file.');
  const NAME={step_count:'steps',weight_body_mass:'weight',body_fat_percentage:'bodyFat',resting_heart_rate:'rhr',heart_rate_variability:'hrv',dietary_energy:'cal',protein:'pro',dietary_protein:'pro',carbohydrates:'carb',dietary_carbohydrates:'carb',total_fat:'fat',dietary_fat_total:'fat',dietary_water:'water',water:'water'};
  const by={},mapped=[];
  metrics.forEach(m=>{const nm=String(m.name||'').toLowerCase(),u=m.units||'';
    if(nm==='blood_pressure'){(m.data||[]).forEach(e=>{const ds=toDs(e.date);if(!ds)return;const d=by[ds]||(by[ds]={});if(d.bpSys==null&&e.systolic!=null){d.bpSys=Math.round(e.systolic);d.bpDia=Math.round(e.diastolic)}});mapped.push(['blood_pressure','bpSys']);return}
    if(nm==='sleep_analysis'){(m.data||[]).forEach(e=>{const ds=toDs(e.date);const v=e.asleep??e.totalSleep??e.qty;const c=conv('sleep',u==='min'?'(min)':'',v);if(ds&&c!=null)(by[ds]||(by[ds]={})).sleep=Math.round(c*100)/100});mapped.push(['sleep_analysis','sleep']);return}
    const f=NAME[nm];if(!f)return;mapped.push([nm,f]);
    const hint=/kg/i.test(u)?'kg':/ml/i.test(u)?'ml':/kj/i.test(u)?'kj':u==='L'?'(l)':u;

  });

  return {by,source:'Apple Health',mapped};
}
function readImport(file){
  const nm=file.name.toLowerCase();
  if(/\.(xml|zip)$/.test(nm)){imp={error:'That is the full Apple Health export, which is too large to read here. Use the Health Auto Export app steps above instead.'};softRender();return}
  const r=new FileReader();
  r.onload=()=>{try{const t=String(r.result);const res=/^\s*[\[{]/.test(t)?fromJSON(t):fromCSV(t,nm);
      const ds=Object.keys(res.by).filter(validDate).sort();if(!ds.length)throw new Error('No dated rows found.');
      const fields=[...new Set(ds.flatMap(d=>Object.keys(res.by[d])))];
      const from=validDate(S().startDate)?addDays(S().startDate,-14):ds[0];
      imp={...res,dates:ds,fields,from:from<ds[0]?ds[0]:from,file:file.name}}
    catch(e){imp={error:e.message||'Could not read that file.'}}
    softRender()};
  r.onerror=()=>{imp={error:'Could not read that file.'};softRender()};
  r.readAsText(file);
}
async function runImport(){
  if(!imp||!imp.by)return;
  const from=($('#importFrom')||{}).value||imp.from,over=!!($('#importOver')||{}).checked;
  const ds=imp.dates.filter(d=>d>=from);const msg=$('#importMsg');const btn=main.querySelector('[data-import="go"]');if(btn)btn.disabled=true;
  await storeReady;let n=0,ch=0;

    const cur=clone(state.days[d]||{date:d});let changed=false;
    for(const [f,v] of Object.entries(imp.by[d])){if(over||!has(cur[f])){if(cur[f]!==v){cur[f]=v;changed=true}}}
    n++;if(!changed)continue;

    delete dirty['days/'+d];

  }

}

  if(sw.lock==='x'){sw.dx=dx;sw.c.style.transition='none';sw.c.style.transform=`translateX(${dx*.55}px)`;sw.c.style.opacity=String(1-Math.min(.4,Math.abs(dx)/600))}

function endSwipe(){
  if(!sw)return;const {dx,lock,c}=sw;sw=null;c.style.opacity='';

  c.style.transition='';
  if(Math.abs(dx)<70){snapBack();return}

    .concat(proto.filter(i=>!isSupp(i)).map(i=>i.name),stacks.map(t=>t+' supplements'),['Vacuums','Posing','CPAP','Sleep Hours','Energy','Hunger','Mood Stress','Digestion'],pains.map(a=>a+' pain'),['Side Effects','Red Flags','Notes','Resting HR','HRV','Recovery','Strain','Body Fat']);
  const q=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=Object.keys(state.days).sort().map(ds=>{const d=state.days[ds],p=plan(ds);return [ds,DOWL[p.wd],d.weight,has(d.bpSys)?d.bpSys+'/'+d.bpDia:'',d.pulse,has(d.pmBpSys)?d.pmBpSys+'/'+d.pmBpDia:'',d.pmPulse,d.workoutType||p.train,yn(d.workoutDone),yn(d.cardioDone),d.cardioMin,d.steps,d.cal,d.pro,d.carb,d.fat,d.meals,d.water]
    .concat(proto.filter(i=>!isSupp(i)).map(i=>yn(d[itemKey(i)])),stacks.map(t=>yn(d[stackKey(t)])),[yn(d.vacuums),yn(d.posing),yn(d.cpap),d.sleep,d.energy,d.hunger,d.mood,d.digestion],pains.map(a=>d[painKey(a)]),
    [(d.sideEffects||[]).join('; '),(d.flags||[]).join('; '),[d.amNotes,d.nutNotes,d.perfNotes,d.painNotes,d.protoNotes,d.injNotes,d.eveNotes].filter(Boolean).join(' | '),d.rhr,d.hrv,d.recovery,d.strain,d.bodyFat]).map(q).join(',')});
  return [cols.map(q).join(',')].concat(rows).join('\n');
}
async function doExport(kind){
  const msg=$('#exportMsg');
  let dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(!dl){if(msg)msg.textContent='Export is not available in this view. Open the published page on claude.ai.';return}
  const stamp=today();
  try{
    if(kind==='csv')await dl.save({filename:`prep-log-${stamp}.csv`,data:csv()});
    else await dl.save({filename:`prep-log-backup-${stamp}.json`,data:JSON.stringify({exportedAt:new Date().toISOString(),settings:state.settings,days:state.days,weeks:state.weeks,labs:state.labs},null,2)});
    if(msg)msg.textContent='Saved.';
  }catch(e){if(msg)msg.textContent=e&&e.code==='declined'?'Export cancelled.':'Export failed: '+(e&&e.message||'try again')}
}

render();
initStore();
})();
</script>
