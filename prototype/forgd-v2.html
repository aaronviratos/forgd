<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORGD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<style>
:root{
  --font-head:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-body:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#D6D3CA;--surface:#ECE9E2;--sunk:#E0DDD5;--ink:#1C1F20;--muted:#585C56;--line:#A7A398;
  --bronze:#BF4509;--bronze-ink:#FFFFFF;--bronze-soft:#F0D6C5;--steel:#4B5828;--steel-soft:#DDE1C9;
  --ok:#2F6B35;--ok-soft:#D9E8D3;--warn:#8A5A0B;--warn-soft:#F3E4C4;--bad:#AE2C22;--bad-soft:#F4D7D2;
  --plate:#24292B;--plate-ink:#ECE8DE;--plate-muted:#A2A69E;--plate-line:#3B4245;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131617;--surface:#1D2123;--sunk:#101314;--ink:#E6E2D8;--muted:#8E928A;--line:#363C3F;
    --bronze:#FF6B1A;--bronze-ink:#150A02;--bronze-soft:#3B2213;--steel:#A7B464;--steel-soft:#262B19;
    --ok:#7DC47F;--ok-soft:#1B2D1C;--warn:#E6B04F;--warn-soft:#352914;--bad:#F06A5E;--bad-soft:#3A1B18;
    --plate:#252A2C;--plate-ink:#ECE8DE;--plate-muted:#9A9E96;--plate-line:#3B4245;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131617;--surface:#1D2123;--sunk:#101314;--ink:#E6E2D8;--muted:#8E928A;--line:#363C3F;
  --bronze:#FF6B1A;--bronze-ink:#150A02;--bronze-soft:#3B2213;--steel:#A7B464;--steel-soft:#262B19;
  --ok:#7DC47F;--ok-soft:#1B2D1C;--warn:#E6B04F;--warn-soft:#352914;--bad:#F06A5E;--bad-soft:#3A1B18;
  --plate:#252A2C;--plate-ink:#ECE8DE;--plate-muted:#9A9E96;--plate-line:#3B4245;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
.cond,h1,h2,h3{font-family:var(--font-head)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--plate);color:var(--plate-ink);box-shadow:0 1px 0 var(--plate-line)}
.appbar .inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px}
.mark{font:400 23px/1 "Saira Stencil One",var(--font-head);letter-spacing:.06em;background:none;border:0;padding:4px 2px;color:var(--plate-ink);cursor:pointer}
.mark:active{transform:scale(.96)}
.mark span{color:var(--bronze)}
.appbar .page{white-space:nowrap;font:700 19px/1 var(--font-head);color:var(--plate-muted);padding-left:12px;border-left:1px solid var(--plate-line)}
.status{margin-left:auto;font-size:13px;color:var(--plate-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status.err{color:#FF8A7E}
.menubtn{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.07);display:grid;place-content:center;gap:5px}
.menubtn i{display:block;width:20px;height:2px;background:var(--plate-ink);border-radius:2px;transition:transform .2s,opacity .2s}
.menubtn[aria-expanded="true"] i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menubtn[aria-expanded="true"] i:nth-child(2){opacity:0}
.menubtn[aria-expanded="true"] i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.menu{position:absolute;left:0;right:0;top:100%;background:var(--plate);border-radius:0 0 20px 20px;box-shadow:0 18px 40px rgba(0,0,0,.35);padding:6px 12px 14px;display:none}
.menu.open{display:block;animation:drop .22s ease-out}
.menu .inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:rgba(255,255,255,.04);border:0;border-radius:14px;padding:12px 14px;color:var(--plate-ink);border-left:4px solid transparent}
.menu button b{font:700 22px/1.05 var(--font-head)}
.menu button span{font-size:13px;color:var(--plate-muted)}
.menu button[aria-current="page"]{background:rgba(255,255,255,.09);border-left-color:var(--bronze)}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(10,12,13,.45);display:none}
.scrim.open{display:block;animation:fade .2s}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
main{max-width:760px;margin:0 auto;padding:12px 16px 60px}

/* hero: tread plate with hazard stripe */
.hero{position:relative;overflow:hidden;border-radius:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:20px 18px 26px;color:var(--plate-ink);
  background-color:var(--plate);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 3px,transparent 3px 14px),repeating-linear-gradient(-45deg,rgba(255,255,255,.045) 0 3px,transparent 3px 14px)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(-45deg,var(--bronze) 0 12px,#15181A 12px 24px)}
.big{font:400 clamp(72px,21vw,124px)/.84 "Saira Stencil One",var(--font-head);color:var(--bronze)}
.big-lbl{font:800 22px/1.1 var(--font-head);margin-top:8px;letter-spacing:.02em}
.hero .meta{text-align:right;font-size:14px;color:var(--plate-muted);line-height:1.45}
.hero .meta strong{display:block;color:var(--plate-ink);font:700 23px/1.15 var(--font-head)}

.datenav{display:flex;align-items:center;gap:6px;margin:14px 0 4px}
.datenav button,.btn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:600}
.datenav input{flex:1;min-width:0}
.btn.primary{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-ink)}
.btn:disabled{opacity:.5;cursor:default}

h2{font-size:27px;line-height:1.05;margin:28px 0 10px;font-weight:800;letter-spacing:.01em}
h3{font-size:21px;margin:18px 0 8px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}

.strip{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.tag{display:inline-flex;align-items:center;gap:5px;font:700 15px/1 var(--font-head);letter-spacing:.02em;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.tag.train{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag.inj{background:var(--bronze-soft);color:var(--bronze);border-color:var(--bronze)}
.tag.pep{background:var(--steel-soft);color:var(--steel);border-color:var(--steel)}
.tag.off{color:var(--muted)}

.ckhead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px}
.ckhead h2{margin:0}
.ckcount{font:800 26px/1 var(--font-head)}
.ckcount span{color:var(--muted);font-weight:600}
.bar{height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bronze)}
.cklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-top:10px}
.ck{display:flex;align-items:center;gap:9px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:15px;font-weight:500;line-height:1.2}
.ck .box{flex:none;width:18px;height:18px;border:2px solid var(--muted);border-radius:1px;display:grid;place-items:center}
.ck.done{color:var(--muted);border-color:var(--bronze)}
.ck.done .box{background:var(--bronze);border-color:var(--bronze)}
.ck.done .box::after{content:"";width:9px;height:5px;border-left:2px solid var(--bronze-ink);border-bottom:2px solid var(--bronze-ink);transform:translateY(-1px) rotate(-45deg)}

.alerts{display:grid;gap:6px;margin:14px 0 0}
.alert{padding:11px 14px;border-radius:12px;font-size:15px;line-height:1.4;border-left:6px solid}
.alert.urgent{background:var(--bad-soft);border-color:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.info{background:var(--steel-soft);border-color:var(--steel)}
.alert b{font-weight:600}
.notice{background:var(--bronze-soft);border:2px dashed var(--bronze);border-radius:12px;padding:10px 12px;margin:14px 0 0;font-size:15px}
.notice button{background:none;border:0;padding:0;text-decoration:underline;font-weight:600;color:var(--bronze)}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.sec>summary{list-style:none;display:flex;align-items:baseline;gap:10px;padding:12px 14px;cursor:pointer;border-left:6px solid var(--ink)}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .t{font:800 23px/1.05 var(--font-head);letter-spacing:.01em}
.sec>summary .when{font-size:14px;color:var(--muted)}
.sec>summary .cnt{margin-left:auto;font-size:14px;color:var(--muted);white-space:nowrap}
.sec>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:4px;align-self:center;transition:transform .15s}
.sec[open]>summary::after{transform:rotate(-135deg)}
.sec.danger>summary{border-left-color:var(--bad)}
.sec.danger>summary .t{color:var(--bad)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 14px;padding:0 14px 14px;border-top:1px solid var(--line)}
.f{padding-top:12px;min-width:0}
.f.wide{grid-column:1/-1}
.fl{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;margin-bottom:5px}
.fl label,.fl .lbl{font-weight:600;font-size:15px;line-height:1.25}
.hint{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.35}
.badge{font-size:12px;color:var(--muted);white-space:nowrap}
.badge.on{color:var(--bronze);font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:40px}
input:focus,select:focus,textarea:focus{border-color:var(--bronze);outline:none}
input[type=checkbox]{width:auto;min-height:0}
textarea{resize:vertical;min-height:62px;line-height:1.4}
.inwrap{position:relative;display:flex;align-items:center}
.inwrap input{padding-right:44px}
.unit{position:absolute;right:10px;font-size:13px;color:var(--muted);pointer-events:none}
.bp{display:flex;align-items:center;gap:6px}
.bp span{color:var(--muted);font-size:20px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.seg button{flex:1;border:0;background:none;padding:8px 6px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--bronze);color:var(--bronze-ink)}
.seg button.no[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.scale{display:grid;gap:3px}
.scale button{border:1px solid var(--line);background:var(--sunk);border-radius:8px;height:36px;padding:0;font-weight:600;font-size:15px}
.scale button[aria-pressed="true"]{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;line-height:1.2}
.chips button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--surface)}
.chips.danger button[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border:1px solid var(--line);background:var(--sunk);border-radius:8px;font-size:20px;line-height:1}
.stepper output{font:800 28px/1 var(--font-head);min-width:48px;text-align:center}
.water{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.water .adds{display:flex;gap:4px}
.water .adds button{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 9px;font-size:14px;font-weight:600}
.water .bar{grid-column:1/-1;height:10px}
.water .bar i{background:var(--steel)}
.info{font:700 20px/1.3 var(--font-head)}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:2px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}
.stat{background:var(--surface);padding:10px 12px}
.stat .v{font:800 30px/1.05 var(--font-head)}
.stat .l{font-size:13px;color:var(--muted);line-height:1.3}
.stat .v.down{color:var(--ok)}.stat .v.up{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;margin:10px 0}
.card h3{margin:0 0 6px}
.chart{width:100%;height:auto;display:block}
.chart text{font:14px var(--font-body);fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:4px 0 4px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
.empty{color:var(--muted);font-size:15px;padding:18px 0;text-align:center}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.grid td,.grid th{padding:2px 1px;border:0;text-align:center;font-size:12px}
.grid th.rl,.grid td.rl{text-align:left;padding-right:8px;font-size:13px;color:var(--ink);font-weight:500;position:sticky;left:0;background:var(--surface)}
.grid .c{display:block;width:14px;height:14px;border-radius:1px;margin:auto}
.c.y{background:var(--bronze)}
.c.n{border:2px solid var(--bad);opacity:.7}
.c.na{background:none}
.c.na::after{content:"";display:block;width:4px;height:4px;background:var(--line);margin:5px auto}
.c.fut{border:1.5px dashed var(--line)}
.grid th.today{color:var(--bronze)}

.week{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0 16px}
.drow{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow.today{background:var(--bronze-soft);box-shadow:inset 6px 0 0 var(--bronze)}
.drow .dn{font:800 21px/1.05 var(--font-head)}
.drow .dn span{display:block;font:400 13px/1.3 var(--font-body);color:var(--muted)}
.drow .what{font-weight:600}
.drow .sub{font-size:14px;color:var(--muted)}
.drow .strip{margin:6px 0 0}
.drow .tag{font-size:14px;padding:4px 7px}
.ref{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ref .r{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:10px 12px;border-top:1px solid var(--line);font-size:15px;line-height:1.4}
.ref .r:first-child{border-top:0}
.ref .r b{font:700 18px/1.25 var(--font-head)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
/* layered section flow */
.rail{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:22px -2px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;font-size:14px;font-weight:600;white-space:nowrap}
.rail .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--sunk);border:1px solid var(--line)}
.rail button.done .dot{background:var(--steel);border-color:var(--steel);color:var(--surface)}
.rail button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rail button.active .dot{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-ink)}
.layer{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:6px 0}
.layer .li{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--sunk);border:1px solid var(--line)}
.layer.done .li{background:var(--steel);border-color:var(--steel);color:var(--surface)}
.layer .lt{flex:1;min-width:0}
.layer .lt b{display:block;font:700 19px/1.1 var(--font-head)}
.layer .lt span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer.upcoming{opacity:.7}
.layer.danger .lt b{color:var(--bad)}
.active-wrap{position:relative;isolation:isolate;margin:10px 0 26px}
.active-wrap.more::before,.active-wrap.more::after{content:"";position:absolute;z-index:-1;height:24px;background:var(--surface);border:1px solid var(--line);border-radius:0 0 16px 16px}
.active-wrap.more::before{left:10px;right:10px;bottom:-9px;opacity:.85}
.active-wrap.more::after{left:22px;right:22px;bottom:-17px;opacity:.5}
.layer-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px -12px rgba(0,0,0,.28);overflow:hidden}
.layer-card>header{padding:14px 16px 10px;border-top:5px solid var(--bronze)}
.layer-card.danger>header{border-top-color:var(--bad)}
.layer-card .stepno{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.layer-card h2{margin:4px 0 0;font-size:30px}
.layer-card.danger h2{color:var(--bad)}
.layer-card .fields{padding:0 16px 16px}
.layer-card>footer{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--sunk)}
.layer-card>footer .btn{padding:11px 14px}
.layer-card>footer .btn.primary{flex:1;font-weight:600}
.layer-card.entering{animation:rise .32s cubic-bezier(.2,.8,.2,1)}
.layer-card.leaving{transition:transform .17s ease-in,opacity .17s ease-in;transform:translateY(-14px) scale(.97);opacity:0}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
.alldone{text-align:center;padding:26px 18px}
.alldone .big{font-size:64px;color:var(--steel)}
#flowBox,.sec,.layer-card{scroll-margin-top:76px}
/* food */
.meal{border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden;background:var(--sunk)}
.meal>header{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px}
.meal>header b{font:700 18px/1 var(--font-head)}
.meal>header .mt{font-size:13px;color:var(--muted);margin-left:auto;text-align:right}
.meal>header button{border:0;background:var(--bronze);color:var(--bronze-ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.fe{display:grid;grid-template-columns:1fr auto auto;gap:4px 8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface)}
.fe .fn{font-weight:600;font-size:15px;line-height:1.25}
.fe .fm{grid-column:1/2;font-size:13px;color:var(--muted)}
.fe .fq{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.fe .fq input{width:62px;min-height:34px;padding:4px 6px;text-align:center}
.fe .fx{grid-row:1/3;grid-column:3;border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--muted)}
.est{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.swap{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:var(--steel-soft);border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.35}
.swap b{color:var(--steel)}
.swap button{margin-left:auto;flex:none;border:1px solid var(--steel);background:none;color:var(--steel);border-radius:999px;padding:4px 10px;font-weight:600;font-size:13px}
.ftot{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;padding:6px 2px}
.ftot b{font:800 20px/1 var(--font-head)}
.sheetwrap{position:fixed;inset:0;z-index:60;display:none;background:rgba(10,12,13,.5)}
.sheetwrap.open{display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:600px;max-height:90vh;max-height:90dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:640px){.sheetwrap.open{align-items:center}.sheet{border-radius:22px}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sheet h2 button{margin-left:auto;border:0;background:var(--surface);border-radius:50%;width:36px;height:36px;font-size:18px}
.stabs{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.stabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;font-size:14px}
.stabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.srow{display:flex;gap:6px}
.srow input{flex:1}
.res{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.res .rt{display:flex;align-items:flex-start;gap:8px}
.res .rt div{flex:1;min-width:0}
.res .rn{font-weight:600}
.res .rm{font-size:13px;color:var(--muted)}
.res .add{flex:none;border:0;background:var(--bronze);color:var(--bronze-ink);border-radius:999px;padding:7px 14px;font-weight:600}
.res.alt{border-color:var(--steel);background:var(--steel-soft)}
.res.alt .add{background:var(--steel);color:var(--surface)}
.why{font-size:13px;color:var(--steel);margin-top:3px}
.thinking{padding:18px 0;text-align:center;color:var(--muted)}
.preview{max-width:100%;max-height:220px;border-radius:12px;display:block;margin:10px auto}
.ing{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ing:first-child{border-top:0}
.ing .im{font-size:12px;color:var(--muted)}
.ing .swap{margin-top:4px}
.ing .swap button[aria-pressed="true"]{background:var(--steel);color:var(--surface)}
.lbl2{font-weight:600;font-size:14px;margin:10px 0 4px;display:block}

/* menu categories, subnav, settings */
.menu{max-height:calc(100vh - 70px);max-height:calc(100dvh - 70px);overflow:auto}
.menu .inner{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.mcat{background:rgba(255,255,255,.04);border-radius:14px;padding:4px 4px 8px;border-left:4px solid transparent}
.mcat:has(.mt[aria-current="page"]){background:rgba(255,255,255,.08);border-left-color:var(--bronze)}
.menu .mt{display:block;width:100%;background:none;padding:8px 10px 4px;border:0;border-radius:10px}
.menu .mt b{font:700 22px/1.05 var(--font-head)}
.msubs{display:flex;flex-wrap:wrap;gap:5px;padding:4px 8px 0}
.menu .msubs button{display:inline-block;background:rgba(255,255,255,.07);border:0;border-left:0;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;color:var(--plate-ink)}
.menu .msubs button:hover{background:rgba(255,255,255,.14)}
.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:10;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:var(--bg);padding:8px 0 10px;margin:0 0 4px}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.subnav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.part>h2:first-child{margin-top:8px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line)}
:root[data-theme="dark"] .sw{background:var(--cd)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sw{background:var(--cd)}}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
/* clean style */
:root[data-style="clean"] .hero{background-image:linear-gradient(135deg,var(--plate) 40%,color-mix(in srgb,var(--bronze) 45%,var(--plate)))}
:root[data-style="clean"] .hero::after{display:none}
:root[data-style="clean"] .big,:root[data-style="clean"] .mark{font-family:var(--font-head);font-weight:800}
:root[data-style="clean"] .big{font-size:clamp(64px,18vw,104px)}
/* compact */
:root[data-density="compact"] .fields{gap:0 10px;padding-left:12px;padding-right:12px;padding-bottom:10px}
:root[data-density="compact"] .f{padding-top:8px}
:root[data-density="compact"] input,:root[data-density="compact"] select{min-height:36px;padding:5px 8px}
:root[data-density="compact"] .scale button{height:30px}
:root[data-density="compact"] .seg button{padding:6px}
:root[data-density="compact"] .layer{padding:8px 12px;margin:4px 0}
:root[data-density="compact"] .ck{padding:6px 8px}
:root[data-density="compact"] .cklist{gap:4px}
:root[data-density="compact"] .res,:root[data-density="compact"] .card{padding:8px 10px}
:root[data-density="compact"] h2{margin:18px 0 8px}
:root[data-text="large"] main,:root[data-text="large"] .sheet{zoom:1.12}
:root[data-hero="hide"] .hero{display:none}
/* check-in */
.cistart{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bronze);border-radius:16px;padding:14px 16px;margin:12px 0}
.cistart h3{margin:0 0 4px}
.cisum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
.cihead{display:flex;align-items:center;justify-content:space-between}
.cibadge{font-weight:700;font-size:14px;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:4px 10px}
.ci4{grid-template-columns:1fr 1fr}
.cisum .stats,.cistart+.stats{margin:10px 0 4px}
.cimore{margin-top:8px}
.cinudge{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:8px;border:1px dashed var(--bronze);background:color-mix(in srgb,var(--bronze) 14%,transparent);color:var(--plate-ink);border-radius:12px;padding:9px 12px;font-size:14px}
.cinudge span{color:var(--plate-muted);font-size:13px}
/* coach */
.coachbtn{flex:none;display:flex;align-items:center;gap:5px;height:38px;padding:0 12px;border:1px solid var(--bronze);border-radius:999px;background:color-mix(in srgb,var(--bronze) 25%,transparent);color:var(--plate-ink);font-weight:700;font-size:13px}
.coachbtn[hidden]{display:none}
.coachbtn svg{width:16px;height:16px;color:var(--bronze)}
.coachbtn.on{background:var(--bronze);color:var(--bronze-ink)}.coachbtn.on svg{color:inherit}
@media (max-width:380px){.coachbtn span{display:none}.coachbtn{padding:0 10px}}
.coachbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;width:100%;margin-top:10px;text-align:left;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:var(--plate-muted);border-radius:999px;padding:10px 14px;font-size:14.5px}
.coachbar .spark{color:var(--bronze)}.coachbar .spark svg{width:18px;height:18px}
.coachbar i{font-style:normal;font-size:18px}
.clist{display:flex;flex-direction:column;gap:10px;padding:14px 0 6px}
.cwelcome{text-align:center;padding:20px 10px 6px}
.cwelcome .spark svg{width:40px;height:40px;color:var(--bronze)}
.cwelcome h2{margin:6px 0}
.cmsg{max-width:86%;padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.45;white-space:normal;word-wrap:break-word}
.cmsg.me{align-self:flex-end;background:var(--bronze);color:var(--bronze-ink);border-bottom-right-radius:6px}
.cmsg.coach{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.csugg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.csugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;text-align:left}
.cinput{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:46px 1fr 46px;gap:8px;align-items:end;background:var(--bg);padding:8px 0}
.cinput textarea{min-height:46px;max-height:140px;border-radius:22px;padding:11px 14px;resize:none}
.csend{height:46px;border:0;border-radius:50%;background:var(--bronze);color:var(--bronze-ink);font-size:18px}
.csend:disabled{opacity:.5}
/* v2 */
.hello.v2{padding:16px 16px 12px}
.hello.v2 h1{font-size:28px;margin:2px 0 8px}
.hello.v2 .goal{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin:0;border-top:1px solid rgba(255,255,255,.12);padding-top:8px;text-align:left;width:100%}
.hello.v2 .goal-t{font:700 17px/1.25 var(--font-head)}
.hello.v2 .goal-t.empty{color:var(--plate-muted)}
.goal-w{flex:none;font-size:12.5px;font-weight:700;color:var(--bronze);white-space:nowrap}
.hello.v2 .gprog{margin-top:8px}
.hello.v2 .hai{margin-top:10px;padding-top:8px}
.hello.v2 .hai-txt{-webkit-line-clamp:1}
.hday.light{margin:12px 0}
.hday.light .hday-main{background:var(--surface);border-color:var(--line);color:var(--ink)}
.hday.light .hday-main small,.hday.light .hday-main i{color:var(--muted)}
.hday.light .hring circle:first-child{stroke:var(--line)!important}
.hlwrap .hlc{background:var(--sunk);color:var(--ink)}
.hlwrap .hlc.good{background:var(--ok-soft);color:var(--ok)}
.hlwrap{margin:4px 0 10px}
.acard .astats .astat{grid-template-columns:86px 1fr 28px 10px}
.acard .astat b{letter-spacing:0;font-weight:600;color:var(--plate-ink);font-size:12.5px}
.lg{padding-top:4px}
.lghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lghead b{font:800 20px/1.1 var(--font-head)}
.lgex{border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px;margin:10px 0;background:var(--surface)}
.lgexh{display:flex;align-items:center;gap:8px}
.lgexh b{font-size:16px;flex:1}
.prb{font-size:11.5px;font-weight:800;color:var(--bronze-ink);background:var(--bronze);border-radius:999px;padding:2px 8px}
.lgrow{display:grid;grid-template-columns:30px 1fr 74px 60px 40px;gap:6px;align-items:center;padding:4px 0}
.lgrow.lgh span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.lgrow span{font-size:14px;text-align:center}
.lgrow .pv{color:var(--muted);font-size:13px}
.lgrow input{min-height:38px;padding:4px 6px;text-align:center}
.lgck{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);font-weight:800;color:var(--muted)}
.lgck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.lgrow.done{background:var(--ok-soft);border-radius:10px}
.lgadd{display:flex;gap:6px;margin-top:8px}
.lgadd input{flex:1}
.restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:32;width:min(92vw,420px);display:flex;align-items:center;gap:8px;background:var(--plate);color:var(--plate-ink);border-radius:16px;padding:10px 12px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);overflow:hidden}
.restbar[hidden]{display:none}
.restbar .rl{font-size:12px;color:var(--plate-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.restbar b{font:800 26px/1 var(--font-head);margin-right:auto}
.restbar button{border:0;background:rgba(255,255,255,.1);color:var(--plate-ink);border-radius:10px;padding:8px 10px;font-weight:700}
.restbar i{position:absolute;left:0;bottom:0;height:3px;background:var(--bronze)}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tpl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px}
.tpl b{font:800 16px/1.15 var(--font-head)}
.tpl small{font-size:12px;color:var(--muted)}
/* legible defaults */
:root:not([data-hf]) h2{letter-spacing:-.01em}
h1,h2,h3,.gname,.pagebar h1{letter-spacing:-.015em}
.pagebar h1{font-size:28px}
h2{font-size:24px}
.hello h1,.hello.v2 h1{font-size:26px}
.acard .gname{font-size:22px}
.sec>summary .t,.layer-card h2{letter-spacing:-.01em}
.ttabs button,.subnav button{font-size:14px}
body{font-size:16px;line-height:1.5}
.small{font-size:14px}
/* demo */
.demobar{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:8px 12px;margin:12px 0 0;font-size:14px}
/* journey, photos, plan edit */
.jcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:0 0 12px;border:1px solid var(--bronze);background:var(--bronze-soft);border-radius:16px;padding:12px 14px}
.jcard b{display:block;font:800 18px/1.1 var(--font-head)}
.jcard small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.jring{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bronze);color:var(--bronze-ink);font-weight:800}
.jlist{display:grid;gap:6px}
.jstep{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.jstep b{display:block;font-size:15.5px}
.jstep small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.jn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);border:1px solid var(--line);font-weight:700}
.jstep.done{opacity:.6}.jstep.done .jn{background:var(--ok);border-color:var(--ok);color:#fff}
.jstep.next{border-color:var(--bronze)}.jstep.next .jn{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-ink)}
.mphoto{width:100%;max-width:240px;border-radius:12px;display:block}
.pstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.pthumb{flex:none;border:0;background:none;padding:0;text-align:center}
.pthumb img{width:90px;height:120px;object-fit:cover;border-radius:10px;display:block;border:1px solid var(--line)}
.pthumb span{font-size:12px;color:var(--muted)}
.pday.tap,.drow.tap{cursor:pointer}
.pday.tap:hover,.drow.tap:hover{border-color:var(--bronze)}
.ped{font:600 11px/1 var(--font-body);font-style:normal;color:var(--bronze);margin-left:6px;vertical-align:middle}
.abtn.ai .spark{color:inherit}
/* nutrition, labs upload, actions, mic, highlights */
.labup .drop{display:flex;align-items:center;justify-content:center;gap:8px}
.labup svg{width:20px;height:20px}
.nextlabs b{font:700 18px/1.2 var(--font-head)}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.abtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px}
.abtn b{font:800 17px/1.1 var(--font-head)}
.abtn small{font-size:12.5px;color:var(--muted)}
.abtn.ai{grid-column:1/-1;background:var(--bronze);border-color:var(--bronze);color:var(--bronze-ink)}
.abtn.ai small{color:inherit;opacity:.85}
.abtn .spark svg{width:18px;height:18px}
.qmicrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.qmic{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.qmic.on{background:var(--bad);border-color:var(--bad);color:#fff;animation:blink 1.2s infinite}
.hl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hlc{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.09)}
.hlc.good{background:color-mix(in srgb,var(--ok) 38%,transparent)}
/* today tabs */
.ttabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:9;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:var(--bg);padding:10px 0;margin:6px 0 0}
.ttabs::-webkit-scrollbar{display:none}
.ttabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.ttabs button.done{color:var(--ok);border-color:var(--ok)}
.ttabs button.danger{color:var(--bad)}
.ttabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.layer-card #ckBox .ckhead{margin-top:4px}
.layer-card>header .strip{margin:8px 0 0}
.layer-card>footer .btn[data-flow="prev"]{flex:none;width:48px}
.labadd{margin-top:8px}
/* measurements */
.mhead b{font:700 18px/1.2 var(--font-head)}
.mhead .actions{margin:10px 0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mcard span{font-size:13px;color:var(--muted);font-weight:600}
.mcard b{font:800 26px/1.1 var(--font-head)}
.mcard b small{font-size:13px;color:var(--muted);font-weight:600}
.mcard em{font-style:normal;font-size:12px;color:var(--muted)}
.mcard em.up{color:var(--steel)}.mcard em.down{color:var(--bronze)}
.mcard.empty{opacity:.55}
.mspark{color:var(--bronze);height:26px}.mspark .spk{height:26px}
.mcard .bar{height:6px;margin-top:4px}
.mcard small{font-size:11.5px;color:var(--muted)}
/* program builder */
.prog-hero{padding:14px}
.pchoose{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media (max-width:360px){.pchoose{grid-template-columns:1fr}}
.pbig{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:14px;padding:12px}
.pbig b{font:800 18px/1.1 var(--font-head)}
.pbig small{font-size:12.5px;color:var(--muted);line-height:1.3}
.pbig.ai{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-ink)}
.pbig.ai small{color:inherit;opacity:.85}
.pbig .spark svg{width:18px;height:18px}
.freq{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px}
.fq{font-size:12.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);color:var(--muted)}
.fq b{font-weight:600;margin-right:4px;color:var(--ink)}
.fq.f0{opacity:.55}.fq.f1{background:var(--steel-soft)}.fq.f2,.fq.f3{background:var(--ok-soft);border-color:var(--ok)}
.pweek{display:grid;gap:6px}
.pday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.pday.rest{opacity:.65}
.pdh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pdh b{font:800 17px/1.1 var(--font-head)}
.pdh span{font-weight:600;font-size:14px}
.pm{font-size:12.5px;color:var(--muted);margin-top:2px}
.pex{margin:6px 0 0;padding-left:20px;font-size:14px}
.pex li{padding:2px 0}
.pex li span{margin-right:8px}
.pex li b{color:var(--bronze);font-weight:600;white-space:nowrap}
.pedit{padding:12px}
.seg.sm button{padding:5px 12px;font-size:13px}
.exl{margin-top:8px}
.exr{display:grid;grid-template-columns:1fr 58px 70px 32px;gap:6px;align-items:center;margin-bottom:6px}
.exr input{min-height:38px;padding:6px 8px}
/* biomarkers + finders */
.bios h3{margin:0 0 4px}
.biochips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--sunk)}
.bchip i{font-style:normal;font-weight:700;margin-left:4px}
.bchip.high{border-color:var(--bad);background:var(--bad-soft)}.bchip.high i{color:var(--bad)}
.bchip.low{border-color:var(--steel);background:var(--steel-soft)}.bchip.low i{color:var(--steel)}
.bchip.borderline{border-color:var(--warn);background:var(--warn-soft)}.bchip.borderline i{color:var(--warn)}
.finder{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bronze);border-radius:14px;padding:12px 14px;margin:12px 0}
.finder .ai-tag{display:inline-flex;align-items:center;gap:6px}
.finder .ai-tag svg{width:16px;height:16px}
.fitem{border-top:1px solid var(--line);padding:10px 0 4px}
.fitem p{margin:4px 0;font-size:14.5px;line-height:1.45}
.fh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fh b{font-size:16px}
.ev{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.ev.strong{background:var(--ok-soft);color:var(--ok)}.ev.moderate{background:var(--steel-soft);color:var(--steel)}.ev.limited{background:var(--warn-soft);color:var(--warn)}
.ftags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.ftags span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bronze-soft);color:var(--bronze);font-weight:600}
.fcaution{background:var(--warn-soft);border-radius:8px;padding:6px 9px;font-size:13.5px!important}
.fact{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.fact .btn{padding:6px 12px;font-size:14px}
.fnote{background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:14px}
.favoid{font-size:14px;margin:4px 0}
.flx{font-size:14px!important}
.flx.more b{color:var(--ok)}.flx.less b{color:var(--bad)}.flx.swap b{color:var(--bronze)}
/* avatar + bottom tab bar */
.avbtn{flex:none;width:38px;height:38px;border-radius:50%;padding:0;overflow:hidden;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);display:grid;place-items:center}
.avbtn[hidden]{display:none}
.avbtn.on{border-color:var(--bronze)}
.avbtn img{width:100%;height:100%;object-fit:cover}
.avbtn svg{width:22px;height:22px;fill:var(--plate-muted)}
.appbar .inner{gap:10px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px -12px rgba(0,0,0,.25)}
.tabbar:empty{display:none}
.tabbar .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr) 72px repeat(2,1fr);align-items:center}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:9px 0 8px;color:var(--muted);font-size:11.5px;font-weight:700}
.tb svg{width:24px;height:24px;fill:currentColor}
.tb.on{color:var(--bronze)}
.tb.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--bronze)}
.tbplus{justify-self:center;width:56px;height:56px;margin-top:-26px;border:4px solid var(--bg);border-radius:50%;background:var(--bronze);color:var(--bronze-ink);display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.45)}
.tbplus svg{width:28px;height:28px;fill:currentColor}
.tbplus:active{transform:scale(.94)}
body.has-tabbar main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.sheetwrap{z-index:60}
/* week strip */
.wkhead{display:flex;align-items:center;gap:12px;margin:16px 0 8px}
.wkhead b{font:800 22px/1 var(--font-head)}
.wkhead .linkbtn{margin-left:auto}
.wkcal{position:relative;display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.wkhead .linkbtn+.wkcal{margin-left:0}
.wkhead b+.wkcal{margin-left:auto}
.wkcal svg{width:22px;height:22px;fill:var(--ink)}
.wkcal input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;min-height:0;padding:0}
.wkstrip{display:grid;grid-template-columns:22px repeat(7,1fr) 22px;gap:5px;align-items:center}
.wknav{border:0;background:none;font-size:22px;color:var(--muted);padding:0;height:60px}
.wknav:disabled{opacity:.25}
.wkd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.wkd b{font:700 19px/1.1 var(--font-body)}
.wkd span{font-size:11.5px;color:var(--muted)}
.wkd i{width:5px;height:5px;border-radius:50%;margin-top:2px}
.wkd i.dot{background:var(--ink)}
.wkd.today b{color:var(--bronze)}
.wkd.sel{background:var(--bronze-soft);border:2px solid var(--bronze)}
.wkd.sel i.dot{background:var(--bronze)}
.wkd:disabled{opacity:.4}
/* quick log */
.qlog{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;width:100%;margin-top:10px;text-align:left;border:0;border-radius:12px;padding:10px 12px;background:var(--bronze);color:var(--bronze-ink)}
.qlog svg{width:22px;height:22px}
.qlog b{display:block;font:700 17px/1.1 var(--font-head)}
.qlog small{display:block;font-size:12.5px;opacity:.85}
.qbtn{margin-left:auto}
.qbtn+.aibtn{margin-left:6px}
.qrow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.qrow .btn{margin-left:auto}
.qlist{display:grid;gap:6px}
.qitem{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer}
.qitem input{width:18px;height:18px;min-height:0;margin-top:2px;accent-color:var(--bronze)}
.qitem b{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.qitem span{font-size:15px;line-height:1.35}
.qitem small{display:block;font-size:12px;color:var(--muted)}
.qitem.danger{border-color:var(--bad);background:var(--bad-soft)}
#qsheet h2 .spark{color:var(--bronze)}
/* menu accordion + page bar */
.menu .mcat{padding:0;border-left:4px solid transparent}
.menu .mcat.cur{border-left-color:var(--bronze);background:rgba(255,255,255,.07)}
.menu .mcat .mt{display:flex;flex-direction:row;align-items:center;justify-content:space-between;text-align:left;padding:12px 14px;width:100%}
.menu .mt i{font-style:normal;font-size:20px;color:var(--plate-muted);transition:transform .2s}
.menu .mcat.open .mt i{transform:rotate(90deg)}
.menu .msubs{padding:0 12px 12px}
.menu .msubs .mgo{background:var(--bronze);color:var(--bronze-ink);font-weight:700}
.menu .inner{grid-template-columns:1fr;gap:4px;max-width:520px}
.chapters[hidden],.dots[hidden]{display:none}
.pagebar{display:flex;align-items:center;gap:10px;margin:14px 0 2px}
.pagebar h1{font:800 30px/1 var(--font-head);margin:0}
.aibtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bronze);background:var(--bronze-soft);color:var(--bronze);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px}
.aibtn svg{width:16px;height:16px}
.subnav{top:calc(env(safe-area-inset-top,0px) + 64px)}
/* home today row */
.hday{margin-top:12px}
.hday-main{display:grid;grid-template-columns:40px 1fr 14px;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 12px;color:var(--plate-ink)}
.hring{width:40px;height:40px}
.hday-main span{min-width:0}
.hday-main b{display:block;font-size:14.5px}
.hday-main small{display:block;font-size:12.5px;color:var(--plate-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hday-main i{font-style:normal;color:var(--plate-muted);font-size:18px}
.upchip{font:700 13px/1 var(--font-body);color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:3px 8px;margin-left:6px;vertical-align:middle}
/* profile */
.prof{display:flex;align-items:center;gap:14px;margin-top:10px}
.pav{width:76px;height:76px;border-radius:50%;overflow:hidden;flex:none;background:var(--plate);display:grid;place-items:center;border:3px solid var(--bronze)}
.pav img{width:100%;height:100%;object-fit:cover}
.pav svg{width:44px;height:44px;fill:var(--bronze)}
/* home header */
.hello{margin:12px 0 14px;padding:16px 16px 14px;border-radius:20px;color:var(--plate-ink);background-color:var(--plate);background-image:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--bronze) 32%,transparent),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 3px,transparent 3px 14px);box-shadow:0 14px 30px -18px rgba(0,0,0,.6)}
.hello-top{display:flex;align-items:flex-start;gap:10px}
.hello-date{margin:0;font-size:13px;color:var(--plate-muted)}
.hello h1{font:800 30px/1.05 var(--font-head);margin:3px 0 0}
.hello-edit{margin-left:auto;flex:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--plate-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.goal{display:block;width:100%;text-align:left;background:none;border:0;padding:0;margin:12px 0 0;color:inherit}
.goal-k{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--bronze)}
.goal-t{display:block;font:700 20px/1.2 var(--font-head);margin-top:2px}
.goal.empty .goal-t{color:var(--plate-muted);font-weight:600}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gchip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.09)}
.gchip.ok{background:color-mix(in srgb,var(--ok) 35%,transparent)}
.gchip.warn{background:color-mix(in srgb,var(--warn) 40%,transparent)}
.gprog{margin-top:10px}
.gprog .bar{height:8px;background:rgba(255,255,255,.12);border:0}
.gpl{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--plate-muted);margin-top:5px}
.gpl b{color:var(--plate-ink)}
.hai{margin-top:12px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.hai-pre{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;width:100%;background:none;border:0;padding:0;color:var(--plate-ink);text-align:left}
.hai-pre .spark{color:var(--bronze);margin-top:1px}.hai-pre .spark svg{width:18px;height:18px}
.hai-txt{font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent 100%) ,linear-gradient(#000 0 0);-webkit-mask-size:100% 1.45em,100% calc(100% - 1.45em);-webkit-mask-position:0 100%,0 0;-webkit-mask-repeat:no-repeat;mask-image:linear-gradient(90deg,#000 55%,transparent 100%),linear-gradient(#000 0 0);mask-size:100% 1.45em,100% calc(100% - 1.45em);mask-position:0 100%,0 0;mask-repeat:no-repeat}
.hai.open .hai-txt{display:none}
.hai.open .hai-pre{grid-template-columns:auto 1fr auto}
.hai.open .hai-pre::after{content:"AI coach";grid-column:2;grid-row:1;font:700 16px/1.2 var(--font-head);color:var(--bronze)}
.hai-more{font-size:12.5px;font-weight:700;color:var(--bronze);white-space:nowrap;align-self:end}
.hai .ai{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-left:3px solid var(--bronze);color:var(--plate-ink);margin:10px 0 0}
.hai .ai-tag{display:none}
.hai .ai .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:var(--plate-ink)}
.hai .ai-pts li span,.hai .ai-foot,.hai .small.muted{color:var(--plate-muted)}
/* card hub */
.acard.r-rookie{--r1:#7C848C;--r2:#C3C9CF}
.acard.r-bronze{--r1:#A8652E;--r2:#E8A56E}
.acard.r-silver{--r1:#8390A0;--r2:#E3E8EE}
.acard.r-gold{--r1:#C8960C;--r2:#FFD966}
.acard.r-platinum{--r1:#2E9C9C;--r2:#A8F0E8}
.acard.r-diamond{--r1:#6D5BFF;--r2:#C9B8FF}
.r-platinum .gface,.r-diamond .gface{border-color:transparent;background:linear-gradient(160deg,color-mix(in srgb,var(--r1) 22%,var(--plate)),var(--plate) 45%) padding-box,linear-gradient(120deg,var(--r1),var(--r2),var(--r1),var(--r2)) border-box;background-size:100% 100%,300% 300%;animation:foil 6s linear infinite}
.acard .gface{box-shadow:0 18px 40px -16px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08)}
.acard .aart{position:relative;display:block;height:auto;aspect-ratio:7/5;padding:0;overflow:hidden;cursor:pointer;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--r1) 50%,transparent),transparent 70%),repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 9px)}
.aart input,.aback-photo input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.aart img{width:100%;height:100%;object-fit:cover;display:block}
.aart:focus-within{outline:2px solid var(--r2);outline-offset:2px}
.aph{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--plate-muted);font-size:13px;font-weight:600}
.aph svg{width:64px;height:64px;fill:var(--r2);opacity:.9}
.arank,.astk{position:absolute;bottom:8px;background:rgba(10,12,14,.72);color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:.04em;backdrop-filter:blur(4px)}
.arank{left:8px;text-transform:uppercase;color:var(--r2);border:1px solid var(--r2)}
.astk{right:8px}.astk b{font:800 14px/1 var(--font-head)}
.acam{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(10,12,14,.65);color:#fff}
.acard .astat{grid-template-columns:36px 1fr 28px 10px}
.astat .chev{font-style:normal;color:var(--plate-muted);font-size:16px}
.alifts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.alift{display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px 9px;color:var(--plate-ink);font-size:11px;text-align:left}
.alift span{color:var(--plate-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.alift b{font:800 16px/1.1 var(--font-head)}
.acard .gb{display:flex;flex-direction:column;align-items:flex-start;text-align:left;cursor:pointer;background:none;font-family:inherit}
.acard .gb:disabled{cursor:default}
.acard .gb.on{background:color-mix(in srgb,var(--r1) 35%,transparent)}
.acard .gb:not(:disabled):hover{border-color:var(--r2)}
.aback-photo{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.aback-photo .abadge{cursor:pointer;position:relative}
.alabel2{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.sxp .bar{height:8px;margin-bottom:4px}
.acts{display:grid;gap:4px}
.act{display:grid;grid-template-columns:1fr 14px;align-items:center;gap:10px;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14.5px}
.act b{color:var(--bronze);font-size:13px;white-space:nowrap}
.act i{font-style:normal;color:var(--muted);font-size:18px}
.act:hover{border-color:var(--bronze)}
.aextra{display:grid;gap:4px;margin:4px 0}
.aextra div{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:14px;padding:6px 10px;background:var(--sunk);border-radius:8px}
.aextra em{font-style:normal;color:var(--muted);font-size:12.5px}
.aimini{max-width:380px;margin:12px auto;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bronze);border-radius:14px}
.adetail .aimini{margin:12px 0 0;max-width:none}
.aimini>summary{list-style:none;display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.aimini>summary::-webkit-details-marker{display:none}
.aimini .spark svg{width:18px;height:18px}
.am-t{font:700 16px/1 var(--font-head);color:var(--bronze);white-space:nowrap}
.am-h{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.aimini[open] .am-h{display:none}
.aimini .ai{border:0;border-top:1px solid var(--line);border-radius:0 0 14px 14px;margin:0}
.aimini .ai-tag{display:none}
.aimini .ai-top .btn{margin-left:0}
.greet h1{font-size:30px}
/* single athlete card */
.acard{--r1:#8A8F94;--r2:#C9CDD1;max-width:380px;margin:0 auto;border-radius:20px}
.acard.r-uncommon{--r1:#2F9E62;--r2:#8BE0AE}
.acard.r-rare{--r1:#2F6FE0;--r2:#8DB8FF}
.acard.r-epic{--r1:#8B3FE0;--r2:#D3A6FF}
.acard.r-legendary{--r1:#E0A21A;--r2:#FF6B1A}
.acard .gin{transition:transform .14s ease-in}
.acard.flipping .gin{transform:scaleX(0)}
.acard .gface{position:relative;inset:auto;border-radius:20px;padding:14px 15px 12px;gap:7px}
.acard.flipped .front{display:none}.acard.flipped .back{display:flex}
.acard .gname{font-size:26px}
.acard .glv b{font-size:28px}
.aart{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:92px;border-radius:12px;padding:0 14px;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--r1) 50%,transparent),transparent 70%),repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 9px);border:1px solid rgba(255,255,255,.1)}
.aart .ovr{font-size:40px;justify-self:start}
.aico svg{width:58px;height:58px;fill:var(--r2)}
.astreak{justify-self:end;display:flex;flex-direction:column;align-items:center}
.astreak b{font:800 30px/1 var(--font-head);color:var(--plate-ink)}
.astreak small{font-size:10px;color:var(--plate-muted)}
.atype{font-size:12.5px;color:var(--plate-muted);text-align:center;margin-top:-2px}
.alabel{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--r2);margin-top:4px;display:flex;gap:8px;align-items:baseline}
.alabel span{text-transform:none;letter-spacing:0;font-weight:500;color:var(--plate-muted)}
.astats{display:grid;gap:2px}
.astat{display:grid;grid-template-columns:36px 1fr 26px;align-items:center;gap:8px;background:none;border:0;border-radius:8px;padding:5px 6px;color:var(--plate-ink);font-size:12.5px;text-align:left}
.astat b{font-weight:700;letter-spacing:.04em;color:var(--plate-muted)}
.astat em{font-style:normal;font-weight:800;text-align:right;font-family:var(--font-head);font-size:17px}
.astat .gbar{height:7px}
.astat:hover,.amove:hover{background:rgba(255,255,255,.06)}
.astat[aria-pressed="true"],.amove[aria-pressed="true"]{background:color-mix(in srgb,var(--r1) 35%,transparent);box-shadow:inset 0 0 0 1px var(--r2)}
.astat[aria-pressed="true"] b{color:var(--plate-ink)}
.amoves{display:grid;gap:3px}
.amove{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;background:none;border:0;border-top:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px;color:var(--plate-ink);text-align:left}

.amove .mn{font-weight:600;font-size:13.5px;line-height:1.2}

  clearTimeout(timers[key]);timers[key]=setTimeout(()=>flush(col,id),600);
}
function flush(col,id){
  const key=col+'/'+id,seq=dirty[key];
  const data=clone(objFor(col,id));data.updatedAt=new Date().toISOString();
  if(col==='weeks')data.summary=weekSummary(id);
  chains[key]=(chains[key]||Promise.resolve()).then(async()=>{
    await storeReady;
    if(col==='settings')await store.putSettings(data);else await store.put(col,id,data);
    if(col==='settings')state.settingsSaved=true;
  }).then(()=>{
    if(dirty[key]===seq)delete dirty[key];
    if(!Object.keys(dirty).length)setStatus('ok',store.kind==='db'?'Saved':'Saved on this device');
  }).catch(e=>{
    const code=e&&e.code;
    setStatus('err',code==='quota_exceeded'?'Storage is full. Export a backup and clear old labs.':'Not saved: '+(e&&e.message||'try again'));
  });
}

}

/* ---------- field rendering ---------- */
function filled(f,o){
  if(f.t==='info'||f.t==='ai'||f.t==='planned')return false;
  if(f.t==='logger')return Array.isArray(o.sets)&&o.sets.some(e=>e.sets.some(s=>s.done));
  if(f.t==='food')return Array.isArray(o.food)&&o.food.length>0;
  if(f.t==='bp')return has(o[f.ks[0]])&&has(o[f.ks[1]]);
  if(f.t==='protocol'){const p=plan(state.date);return p.due.some(it=>o[isSupp(it)?stackKey(it.timing||'Any time'):itemKey(it)]!=null)}
  if(f.t==='pains')return painAreas().some(a=>has(o[painKey(a)]));
  const v=getv(o,f.k);
  if(Array.isArray(v))return v.length>0;
  if(typeof v==='boolean')return true;
  return v!=null&&String(v).trim()!=='';
}

function stacksFor(items){const g={};items.filter(isSupp).forEach(it=>{const t=it.timing||'Any time';(g[t]=g[t]||[]).push(it)});return TIMINGS.filter(t=>g[t]).map(t=>[t,g[t]])}

/* ---------- checklist & alerts ---------- */
function checklist(ds,d){
  d=d||{};const p=plan(ds),s=S(),out=[];
  const add=(k,label,done)=>out.push({k,label,done:!!done});
  add('weight','Weigh-in',has(d.weight));
  if(bpOn())add('bp','AM BP + pulse',has(d.bpSys)&&has(d.bpDia));
  if(usesCpap())add('cpap','CPAP last night',d.cpap===true);
  if(has(s.water))add('water',`Water ${s.water} oz`,N(d.water)>=N(s.water));
  if(has(s.meals))add('meals',`${s.meals} meals`,N(d.meals)>=N(s.meals));
  if(has(s.pro))add('pro',`Protein ${s.pro} g`,N(d.pro)>=N(s.pro));
  if(p.trainDay)add('workoutDone',p.train,d.workoutDone===true);
  if(p.cardioReq)add('cardioDone','Cardio',d.cardioDone===true);
  p.due.filter(i=>!isSupp(i)).forEach(it=>add(itemKey(it),it.name,d[itemKey(it)]===true));
  stacksFor(p.due).forEach(([t])=>add(stackKey(t),`${t} supplements`,d[stackKey(t)]===true));
  if(TR().posing){add('vacuums','Vacuums',d.vacuums===true);add('posing','Posing',d.posing===true)}
  if(has(s.steps))add('steps',`${Number(s.steps).toLocaleString()} steps`,N(d.steps)>=N(s.steps));
  if(p.pmBp)add('pmBp','Evening BP',has(d.pmBpSys)&&has(d.pmBpDia));
  return out;
}
function alerts(ref){
  ref=ref||today();const s=S(),out=[];
  const last=n=>[...Array(n)].map((_,i)=>addDays(ref,-i));
  const L7=last(7);
  const reads=[];
  L7.forEach(ds=>{const d=state.days[ds];if(!d)return;
    if(has(d.bpSys)&&has(d.bpDia))reads.push({ds,s:N(d.bpSys),d:N(d.bpDia)});
    if(has(d.pmBpSys)&&has(d.pmBpDia))reads.push({ds,s:N(d.pmBpSys),d:N(d.pmBpDia)})});
  const crisis=reads.find(r=>r.s>=180||r.d>=120);
  if(crisis)out.push({lv:'urgent',h:`BP ${crisis.s}/${crisis.d} on ${fmtD(crisis.ds)}.`,t:'Recheck after 5 minutes seated. If it stays this high, or you have chest pain, shortness of breath, vision changes or a severe headache, call 911.'});
  else{const hi=reads.filter(r=>r.s>=160||r.d>=100);if(hi.length)out.push({lv:'warn',h:`BP at or above 160/100 on ${hi.length} reading${hi.length>1?'s':''} this week.`,t:'Contact your doctor soon and share your log.'})}
  const over=reads.filter(r=>r.s>=N(s.bpSys)||r.d>=N(s.bpDia));
  if(over.length>=2&&!crisis)out.push({lv:'warn',h:`BP at or above ${s.bpSys}/${s.bpDia} on ${over.length} of ${reads.length} readings in the last 7 days.`,t:'A repeated pattern is worth raising with your doctor.'});
  const flagged=[];L7.forEach(ds=>{const f=(state.days[ds]||{}).flags;if(Array.isArray(f))f.forEach(x=>flagged.push({ds,x}))});
  const recentUrgent=flagged.filter(f=>URGENT.has(f.x)&&dayNum(ref)-dayNum(f.ds)<=1);
  if(recentUrgent.length)out.unshift({lv:'urgent',h:`${recentUrgent.map(f=>f.x).join(', ')} logged.`,t:'If this is happening now, call 911 or go to the nearest ER.'});
  const other=flagged.filter(f=>!recentUrgent.includes(f));
  if(other.length)out.push({lv:'warn',h:`Red-flag symptom${other.length>1?'s':''} this week: ${[...new Set(other.map(f=>f.x))].join(', ')}.`,t:'Contact your doctor about these.'});
  const pulses=Object.keys(state.days).sort().map(k=>N(state.days[k].pulse)).filter(v=>v!=null);
  if(pulses.length>=10){const base=avg(pulses.slice(0,7));const recent=avg(last(3).map(ds=>(state.days[ds]||{}).pulse));
    if(recent!=null&&recent>=base+15)out.push({lv:'warn',h:`Resting pulse averaging ${r0(recent)} over the last 3 days vs. your baseline of ${r0(base)}.`,t:'Keep an eye on it and mention it to your doctor if it holds.'})}
  const pain=[];last(3).forEach(ds=>{const d=state.days[ds]||{};painAreas().forEach(n=>{if(N(d[painKey(n)])>=7)pain.push(n.toLowerCase())})});
  if(pain.length)out.push({lv:'warn',h:`High ${[...new Set(pain)].join(' and ')} pain (7+) in the last 3 days.`,t:'Consider modifying training and getting it checked.'});
  if(L7.some(ds=>(state.days[ds]||{}).injReaction===true))out.push({lv:'warn',h:'Injection site reaction logged this week.',t:'Redness, heat, swelling or fever at a site needs a doctor look.'});

  sheet.busy=true;sheet.err='';R.res=null;R.use={};renderSheet();sheetCtl=new AbortController();
  try{
    const r=await sjson(`Break this recipe or meal into its ingredients with macros: "${R.text.slice(0,2000)}". The recipe makes ${Math.max(1,N(R.servings)||1)} serving(s).
${prepContext()}
Reply with only JSON: {"name":"short recipe name","ingredients":[{"name":"ingredient","amount":"amount used in the whole recipe","cal":0,"pro":0,"carb":0,"fat":0,"swap":null or {"to":"healthier ingredient","amount":"amount","why":"short reason with the saving","cal":0,"pro":0,"carb":0,"fat":0}}]}
Macros are for the full amount of each ingredient in the whole recipe, using standard USDA values. Give each ingredient a swap only when a clearly healthier option fits.`,{signal:sheetCtl.signal,modelTier:'quick'});
    const ing=(Array.isArray(r&&r.ingredients)?r.ingredients:[]).slice(0,30).map(g=>({name:String(g.name||'Ingredient').slice(0,100),amount:String(g.amount||'').slice(0,60),...mac(g),swap:normSwap(g.swap)}));
    if(!ing.length)throw {code:'invalid_json'};
    R.res={name:String(r.name||'Recipe').slice(0,100),ingredients:ing};
  }catch(e){sheet.err=errCopy(e)}
  sheet.busy=false;if(sheet.open)renderSheet();
}
function sheetAdd(key){
  let entry=null;
  const [kind,ix]=key.split(':');
  if(kind==='mine'){const f=state.foods[ix];if(f)entry={name:f.name,serving:f.serving,...mac(f),est:!!f.est,src:f.src,swap:f.swap||null,ingredients:f.ingredients||null,servings:f.servings||null}}
  else if(kind==='item'){const r=sheet.res.items[+ix];entry={...r,src:'search',swap:sheet.res.swaps[0]||null}}
  else if(kind==='scan'){const r=sheet.res.item;entry={...r,swap:sheet.res.swaps[0]||null}}
  else if(kind==='swap'){const s=sheet.res.swaps[+ix];entry={name:s.to,serving:s.serving,...mac(s),est:true,src:'swap',swapped:true}}
  else if(key==='recipe'){const R=sheet.rec,t=recipeTotals();const ings=R.res.ingredients.map((g,i)=>R.use[i]&&g.swap?{name:g.swap.to,amount:g.swap.amount,...mac(g.swap),swap:null}:g);
    entry={name:R.res.name,serving:'1 of '+Math.max(1,N(R.servings)||1)+' servings',...mac(t.per),est:true,src:'recipe',swaps:Object.values(R.use).filter(Boolean).length||undefined,ingredients:ings,servings:Math.max(1,N(R.servings)||1),qty:N(R.eat)||1}}
  else if(key==='manual'){const M=sheet.man;if(!String(M.name||'').trim()){sheet.err='Give the food a name.';renderSheet();return}entry={name:String(M.name).trim(),serving:String(M.serving||'').trim(),...mac(M),est:false,src:'manual'};sheet.man={}}
  if(!entry)return;
  const qty=entry.qty||1;delete entry.qty;
  addFoodEntry({...entry,qty},sheet.meal);closeSheet();
}
function applySwap(id){
  const d=scopeObj('day'),e=(d.food||[]).find(x=>x.id===id);if(!e||!e.swap)return;
  const s=e.swap;Object.assign(e,{name:s.to,serving:s.serving||s.amount||e.serving,...mac(s),est:true,swap:null,swappedFrom:e.name});
  d.food=d.food.slice();recalcFood(d);save('day');rememberFood(e);rerenderSection('nutrition');refreshDay();
}

const pedit={open:false,item:null,id:null,q:''};
function openPSheet(id,cat){
  const it=id?(S().protocol||[]).find(x=>x.id===id):null;
  pedit.id=id;pedit.item=it?clone(it):{id:rid(),cat:CATS[cat]?cat:'supplement',route:'Oral',timing:'Morning',by:'Self',freq:{type:'daily',anchor:today()}};
  pedit.q=it?it.name:'';pedit.open=true;renderPSheet();setTimeout(()=>{const i=$('#pq');if(i&&!id)i.focus()},50);
}
function closePSheet(){pedit.open=false;const el=$('#psheet');el.classList.remove('open');el.setAttribute('aria-hidden','true');el.innerHTML=''}
const advProto=()=>{const v=S().advancedProto;return v!=null?!!v:(S().protocol||[]).some(i=>i.cat==='peptide'||i.cat==='hormone')};
function catMatches(){
  const q=pedit.q.trim().toLowerCase();if(!q)return [];
  const out=[];Object.entries(CATALOG).forEach(([c,a])=>{if(!advProto()&&(c==='peptide'||c==='hormone'))return;a.forEach(n=>{if(n.toLowerCase().includes(q))out.push([c,n])})});
  return out.slice(0,12);
}
function catListHTML(){const m=catMatches();if(!m.length)return '';return `<div class="pqlist">${m.map(([c,n],i)=>`<button type="button" data-pcat="${i}"><b>${esc(n)}</b><span>${CATS[c]}</span></button>`).join('')}</div>`}
function pickCatalog(i){
  const m=catMatches()[+i];if(!m)return;const [c,n]=m,it=pedit.item;
  it.name=n;it.cat=c;pedit.q=n;
  if(c==='supplement'||c==='medication')it.route='Oral';
  else if(c==='device'){it.route='Device';it.timing=/cpap|bipap|mouth/i.test(n)?'Bedtime':'Any time'}
  else if(c==='peptide'||c==='hormone')it.route=/anavar|winstrol|dianabol|turinabol|clomiphene|enclomiphene|tamoxifen|anastrozole|letrozole|exemestane|cabergoline|thyroid|estradiol|progesterone/i.test(n)?'Oral':/testosterone|tren|primo|masteron|nandrolone|npp|boldenone/i.test(n)?'IM injection':'SC injection';
  renderPSheet();
}
function renderPSheet(){
  if(!pedit.open)return;const it=pedit.item,f=it.freq||(it.freq={type:'daily'});

  b+=F({k:'purpose',t:'sel',label:'Purpose',opts:PURPOSES});
  b+=F({k:'dose',t:'text',label:'Dose',ph:'As prescribed or directed'});
  b+=F({k:'route',t:'sel',label:'Route',opts:ROUTES});

  el.classList.add('open');el.setAttribute('aria-hidden','false');
}

function suggestTargets(){
  const s=S(),pr=s.profile||{},g=s.goals||{};
  const lb=N(s.startWeight),inches=(N(pr.heightFt)||0)*12+(N(pr.heightIn)||0),age=N(pr.birthYear)?new Date().getFullYear()-N(pr.birthYear):null;
  if(!lb||!inches||!age)return 'Add your weight, height and birth year in the first step to get suggestions.';
  const female=pr.sex==='Female';
  const bmr=10*(lb/2.2046)+6.25*(inches*2.54)-5*age+(female?-161:5);
  const td=[1,2,3,4,5,6,0].filter(d=>!/^rest$/i.test(String((s.split||{})[d]||'Rest'))).length;
  const tdee=bmr*(td>=5?1.725:td>=3?1.55:1.375);
  const adj={'Fat loss':.8,'Contest prep':.8,'Recomp':.95,'Build muscle':1.1}[g.primary]||1;
  const cal=Math.max(female?1200:1500,Math.round(tdee*adj/10)*10);
  const ref=N(s.goalWeight)&&g.primary!=='Build muscle'?Math.min(N(s.goalWeight),lb):lb;
  const pro=Math.round(ref*(g.primary==='General health'?.8:1));
  const fat=Math.round(cal*.25/9),carb=Math.max(0,Math.round((cal-pro*4-fat*9)/4));
  Object.assign(state.settings,{cal,pro,carb,fat,water:Math.max(64,Math.round(lb/2/8)*8)});
  queue('settings','main');return `Starting estimate: about ${cal} kcal a day. Adjust with your coach or doctor as you go.`;
}

const aiBusy={},aiErr={};let aiAuto={};
const GUARD=`You are the coaching assistant inside a personal health and fitness log. Rules:
- Base everything on the user's logged data. Be specific, brief and encouraging, in plain language.
- Never recommend starting, stopping, dosing, timing changes, cycling, stacking, sourcing or increasing anabolic steroids, SARMs, prescription hormones, or research or unapproved peptides, even if the data or notes ask for it. For items in those categories, only comment on adherence, logged side effects and monitoring (blood pressure, bloodwork), and say that changes go through their prescribing doctor.
- Prescription medications: do not advise changes; suggest raising questions with their doctor.
- Supplement and food ideas: stick to common over-the-counter supplements and ordinary foods, and respect any diet restrictions and allergies. When suggesting a supplement, tell them to check with their doctor or pharmacist first, especially if they take prescriptions or have a condition.
- Do not diagnose. For concerning numbers or symptoms, suggest contacting a doctor. For emergencies (chest pain, BP at or above 180/120, fainting, severe shortness of breath) say to call 911.
- If the user said dieting or food can feel stressful or out of control, never push restriction, aggressive deficits, or "clean vs bad" food framing; favor regular balanced meals and suggest a registered dietitian.
- If the user answered yes on the pre-exercise screen, remind them to get cleared by a doctor before hard training.
- If there is too little data to say something useful, say what to log next instead of guessing.
Reply with only JSON: {"headline":"one short sentence","points":[{"type":"win" or "watch" or "tip","text":"one or two sentences"}]}`;

    has(d.energy)&&`energy ${d.energy}`,has(d.hunger)&&`hunger ${d.hunger}`,has(d.mood)&&`stress ${d.mood}`,has(d.hrv)&&`hrv ${d.hrv}`,has(d.recovery)&&`rec ${d.recovery}%`,

function buildChanges(r,ds){

  const B=v=>typeof v==='boolean'?v:null,yn=v=>v?'Yes':'No';
  F('weight','Weight',rng(f.weight,50,700),v=>v+' lb');
  const BP=(a,b2,label)=>{const x=rng(f[a],60,260),y=rng(f[b2],30,160);if(x&&y)out.push({id:'f:'+a,kind:'multi',kv:{[a]:x,[b2]:y},label,val:`${x}/${y}`,was:has(d[a])&&has(d[b2])?`${d[a]}/${d[b2]}`:null})};
  BP('bpSys','bpDia','Blood pressure');
  F('pulse','Pulse',rng(f.pulse,25,220),v=>v+' bpm');

  if(['Normal','Bloated','Constipated','Loose','Reflux'].includes(f.digestion))F('digestion','Digestion',f.digestion);
  F('steps','Steps',rng(f.steps,0,100000),v=>Number(v).toLocaleString());
  F('workoutDone','Workout completed',B(f.workoutDone),yn);
  if(typeof f.workoutType==='string'&&f.workoutType.trim())F('workoutType','Workout',f.workoutType.trim().slice(0,80));
  F('cardioDone','Cardio completed',B(f.cardioDone),yn);
  if(CARDIO_TYPES.includes(f.cardioType))F('cardioType','Cardio type',f.cardioType);
  F('cardioMin','Cardio minutes',rng(f.cardioMin,0,600),v=>v+' min');F('cardioHR','Cardio heart rate',rng(f.cardioHR,40,220),v=>v+' bpm');
  F('posing','Posing',B(f.posing),yn);F('vacuums','Vacuums',B(f.vacuums),yn);
  BP('pmBpSys','pmBpDia','Evening blood pressure');
  const wa=rng(r.waterAdd,1,400);if(wa)out.push({id:'water',kind:'wateradd',v:Math.round(wa),label:'Water',val:`+${Math.round(wa)} oz`,was:has(d.water)?`${d.water} oz so far`:null});
  const lifts=(Array.isArray(r.lifts)?r.lifts:[]).map(x=>String(x).trim()).filter(Boolean).slice(0,15);
  if(lifts.length)out.push({id:'lifts',kind:'lifts',v:lifts.join('\n'),label:'Lifts',val:lifts.join('; ')});
  (Array.isArray(r.foods)?r.foods:[]).slice(0,20).forEach((x,i)=>{if(!x||!x.name)return;const e={name:String(x.name).slice(0,120),serving:String(x.serving||'').slice(0,80),...mac(x),est:true,src:'ai'};const meal=Math.max(1,Math.min(8,Math.round(N(x.meal)||1)));
    out.push({id:'food'+i,kind:'food',entry:e,meal,label:`Food, meal ${meal}`,val:`${e.name}${e.serving?' ('+e.serving+')':''}, ${e.cal} kcal, ${e.pro} g protein`})});
  const pr=S().protocol||[];
  (Array.isArray(r.protocol)?r.protocol:[]).forEach(n=>{const it=pr.find(i=>!isSupp(i)&&i.name===n);if(it){out.push({id:'p:'+it.id,kind:'field',k:itemKey(it),v:true,label:it.name,val:'Taken'});return}
    const m=String(n).match(/^(.*) supplements$/);if(m&&pr.some(i=>isSupp(i)&&(i.timing||'Any time')===m[1]))out.push({id:'s:'+m[1],kind:'field',k:stackKey(m[1]),v:true,label:n,val:'Taken'})});
  const se=(Array.isArray(r.sideEffects)?r.sideEffects:[]).filter(x=>CAUTIONS.includes(x));if(se.length)out.push({id:'se',kind:'chips',k:'sideEffects',v:se,label:'Side effects',val:se.join(', ')});

  if(f.notes&&String(f.notes).trim())out.push({id:'notes',kind:'note',v:String(f.notes).trim().slice(0,500),label:'Note',val:String(f.notes).trim().slice(0,500)});
  return out;
}

const GOAL_LABEL={'Fat loss':'Lose fat','Build muscle':'Build muscle','Recomp':'Recomp: lose fat, build muscle','Contest prep':'Compete','Strength or performance':'Get stronger','General health':'Get healthier'};
function goalText(){
  const g=S().goals||{};if(g.why&&String(g.why).trim())return String(g.why).trim();
  if(g.primary==='Contest prep')return `Compete${g.eventName?' at '+g.eventName:g.division?' in '+g.division:''}`;
  if(g.primary){const base=GOAL_LABEL[g.primary]||g.primary;return has(S().goalWeight)&&/Fat|muscle/i.test(g.primary)?`${base}, reach ${S().goalWeight} lb`:base}
  return '';
}
function goalProgress(){
  const s=S(),t=today(),ks=Object.keys(state.days).filter(k=>k<=t).sort();
  const w7=avg([...Array(7)].map((_,i)=>(state.days[addDays(t,-i)]||{}).weight));
  const cur=w7!=null?w7:N(ks.map(k=>state.days[k].weight).filter(has).pop());
  const start=N(s.startWeight)??N(ks.map(k=>state.days[k].weight).find(has));
  const goal=N(s.goalWeight);
  const wPct=cur!=null&&start!=null&&goal!=null&&start!==goal?Math.max(0,Math.min(1,(start-cur)/(start-goal))):null;
  let tPct=null,daysLeft=null;
  if(validDate(s.showDate)){daysLeft=dayNum(s.showDate)-dayNum(t);if(validDate(s.startDate)){const tot=dayNum(s.showDate)-dayNum(s.startDate);tPct=tot>0?Math.max(0,Math.min(1,(dayNum(t)-dayNum(s.startDate))/tot)):null}}
  let pace=null;if(wPct!=null&&tPct!=null&&tPct>.05){const d=wPct-tPct;pace=d>.05?['Ahead of pace','ok']:d<-.1?['Behind pace','warn']:['On pace','ok']}
  return {cur,start,goal,wPct,tPct,daysLeft,pace};
}

function tickRest(){

function lineChart(o){

  const pts=series.flatMap(s=>s.pts);
  if(pts.length<2)return `<p class="empty">${esc(o.empty||'Log at least two days to see a trend.')}</p>`;

  const ys=pts.map(p=>p[1]).concat((o.refs||[]).map(r=>r.y));
  let y0=Math.min(...ys),y1=Math.max(...ys);const pd=(y1-y0)*.12||1;y0-=pd;y1+=pd;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let g='';const dp=(y1-y0)<8?1:0;const yf=o.yFmt||(v=>v.toFixed(dp));
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" style="stroke:var(--line);stroke-width:1"/><text x="${L-6}" y="${y+4}" text-anchor="end">${esc(yf(v))}</text>`}
  [x0,Math.round((x0+x1)/2),x1].forEach((x,i)=>{g+=`<text x="${X(x)}" y="${H-6}" text-anchor="${['start','middle','end'][i]}">${esc(fmtD(fromNum(x)))}</text>`});
  (o.refs||[]).forEach(r=>{g+=`<line x1="${L}" x2="${W-R}" y1="${Y(r.y)}" y2="${Y(r.y)}" style="stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4"/>`});
  series.forEach(s=>{
    if(s.line&&s.pts.length>1)g+=`<path d="${s.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('')}" style="fill:none;stroke:${s.color};stroke-width:${s.w||2.5};stroke-linejoin:round;stroke-linecap:round"/>`;
    if(s.dots)s.pts.forEach(p=>{g+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${s.r||3}" style="fill:${s.color};opacity:${s.op||1}"/>`});
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${g}</svg>`;
}

function weekSummary(mon){

}

function scopeObj(scope){
  if(scope==='pi')return pedit.item;
  if(scope==='bq')return state.bq||(state.bq=defaultBq());
  if(scope==='nq')return state.nq||(state.nq=defaultNq());
  if(scope==='meas'){const d=measDate();return state.measures[d]||(state.measures[d]={date:d})}
  if(scope==='day')return state.days[state.date]||(state.days[state.date]={date:state.date});
  if(scope==='week')return state.weeks[state.week]||(state.weeks[state.week]={week:state.week});
  if(scope==='lab')return state.labs[state.labDate]||(state.labs[state.labDate]={date:state.labDate});
  return state.settings;
}
function save(scope){
  if(scope==='pi'||scope==='bq'||scope==='nq')return;
  if(scope==='meas'){queue('measures',measDate());return}
  if(scope==='day')queue('days',state.date);
  else if(scope==='week')queue('weeks',state.week);
  else if(scope==='lab')queue('labs',state.labDate);
  else queue('settings','main');
}
